name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Install Android SDK tools
        run: python mobile/setup_android.py
      - name: Build and sign APK
        run: python mobile/build_apk.py
      - name: Publish versioned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlayerStudio-android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerStudio-android-${{ github.sha }}
          path: dist/PlayerStudio-android.apk
          if-no-files-found: error
          retention-days: 30
